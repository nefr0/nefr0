name: Refresh profile stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-stats.yml']

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate public activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=nefr0&hide_rank=true&show_icons=true&hide=contribs&bg_color=101714&title_color=cbfa83&text_color=f0f4ed&icon_color=cbfa83&border_color=344137&custom_title=Public%20GitHub%20activity&card_width=495&disable_animations=true&number_format=long
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Generate repository languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=nefr0&layout=compact&langs_count=6&bg_color=101714&title_color=cbfa83&text_color=f0f4ed&border_color=344137&custom_title=Public%20repository%20languages&card_width=495&disable_animations=true
          path: assets/github-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public GitHub profile stats'
          git pull --rebase origin main
          git push origin HEAD:main
